{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <h1>Create your Z3BRA account</h1>

    <form method="post" action="/auth/signup">

        <input
    type="email"
    name="email"
    placeholder="Email"
    required
>

<input
    type="password"
    name="password"
    placeholder="Password"
    required
>

        <button type="submit">
            Create Account
        </button>

    </form>

</div>

{% endblock %}
