{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <h1>Sign in to Z3BRA</h1>

    <form method="post" action="/auth/login">

        <input
    type="email"
    name="email"
    placeholder="Email"
    required
>

<input
    type="password"
    name="password"
    placeholder="Password"
    required
>

        <button type="submit">
            Sign in
        </button>

    </form>

</div>

{% endblock %}
