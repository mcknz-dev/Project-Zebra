<section class="dashboard-grid">

    <div class="dashboard-card">

        <div class="card-header">

            <h2>Recent Receipts</h2>

            <a href="/receipts" class="button-link">
    View All
</a>

        </div>

        {% if receipts %}

            <div class="receipt-list">

            {% for receipt in receipts %}

                {% include "components/receipt_row.html" %}

            {% endfor %}

            </div>

        {% else %}

            <p>No receipts yet.</p>

        {% endif %}

    </div>

    <div class="dashboard-card">

        <div class="card-header">

            <h2>Quick Actions</h2>

        </div>

        <p><strong>Your Receipt Inbox</strong></p>

        <p>
            receipt+demo@inbox.project-zebra.online
        </p>

        <br>

        <form action="/upload" method="post" enctype="multipart/form-data">

            <input
                type="file"
                name="receipt"
                accept=".pdf,image/*"
                required>

            <br><br>

            <button>
                Upload Receipt
            </button>

        </form>

    </div>

</section>
